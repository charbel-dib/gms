# Local run: docker compose up --build   then open http://localhost:8080
# Demo data: docker compose exec app node seed-demo.js
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gms
      POSTGRES_PASSWORD: gms-local-password
      POSTGRES_DB: gms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gms"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://gms:gms-local-password@db:5432/gms?sslmode=disable
      DB_CA_FILE: ""
      PUBLIC_URL: http://localhost:8080
      TRUST_PROXY: "false"
      ENCRYPTION_KEY: change-me-local-only-32-chars-min
      SUPERADMIN_EMAIL: admin@gms.local
      SUPERADMIN_PASSWORD: admin12345
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    restart: unless-stopped

volumes:
  pgdata:
